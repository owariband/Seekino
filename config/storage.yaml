# Docker 读取 server。构建桌面宿主时只复制 desktop。
server:
  database:
    type: mysql
    url_env: SEEKINO_DATABASE_URL
  search:
    type: elasticsearch
  media: ffmpeg_cli

desktop:
  database:
    type: sqlite
    file: library.sqlite3
  search:
    type: sqlite
    text: fts5
    vector: sqlite-vec
  media: pyav
