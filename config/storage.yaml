# PR 1 配置草案。Docker 使用 server，桌面构建时只将 desktop 段写入应用包。
server:
  database:
    type: mysql
    url_env: SEEKINO_DATABASE_URL
  search:
    type: elasticsearch
  media: ffmpeg_cli

desktop:
  database:
    type: sqlite
    file: library.sqlite3
  search:
    type: sqlite
    text: fts5
    vector: sqlite-vec  # 首轮验证候选
  media: pyav
