name: CI

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to test against the latest main branch
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Validate pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      merge_sha: ${{ steps.pull_request.outputs.merge_sha }}

    steps:
      - name: Require approved dispatch
        env:
          DISPATCH_ACTOR: ${{ github.actor }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "Run this workflow from the main branch."
            exit 1
          fi
          if [[ "${DISPATCH_ACTOR,,}" != "slimzeo" ]]; then
            echo "Only Slimzeo can approve and dispatch this workflow."
            exit 1
          fi

      - name: Validate pull request
        id: pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .state)"
          base="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .base.ref)"
          head_repository="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.repo.full_name)"
          if [[ "$state" != "open" || "$base" != "main" || "$head_repository" != "$GITHUB_REPOSITORY" ]]; then
            echo "PR #${PR_NUMBER} must be open, target main, and come from this repository."
            exit 1
          fi
          mergeable="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .mergeable)"
          if [[ "$mergeable" != "true" ]]; then
            echo "PR #${PR_NUMBER} does not currently have a conflict-free test merge."
            exit 1
          fi
          merge_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .merge_commit_sha)"
          if [[ -z "$merge_sha" || "$merge_sha" == "null" ]]; then
            echo "PR #${PR_NUMBER} does not have a test merge commit."
            exit 1
          fi
          echo "merge_sha=${merge_sha}" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend tests
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANIVAG_TEST_DATABASE_URL: mysql+pymysql://anivag:anivag-ci@127.0.0.1:3306/anivag_test?charset=utf8mb4
      UV_DEFAULT_INDEX: https://pypi.org/simple

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: anivag_test
          MYSQL_USER: anivag
          MYSQL_PASSWORD: anivag-ci
          MYSQL_ROOT_PASSWORD: root-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.merge_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.24"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run --locked pytest -m "not live_agent"

  frontend:
    name: Frontend checks
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.merge_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  live-agent:
    name: Live Agent smoke
    needs:
      - prepare
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_DEFAULT_INDEX: https://pypi.org/simple

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.merge_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.24"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run simple DeepSeek Agent example
        env:
          ANIVAG_RUN_LIVE_AGENT_TEST: "1"
          DEEPSEEK_API_KEY: ${{ secrets.CI_DEEPSEEK_API_KEY }}
        run: |
          if [[ -z "$DEEPSEEK_API_KEY" ]]; then
            echo "Repository secret CI_DEEPSEEK_API_KEY is not configured."
            exit 1
          fi
          uv run --locked pytest tests/gateway/test_agent_provider_live.py -m live_agent
