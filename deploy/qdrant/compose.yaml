services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "${ANIVAG_QDRANT_BIND_ADDRESS:-127.0.0.1}:${ANIVAG_QDRANT_HTTP_PORT:-6333}:6333"
      - "${ANIVAG_QDRANT_BIND_ADDRESS:-127.0.0.1}:${ANIVAG_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - anivag_qdrant_data:/qdrant/storage

volumes:
  anivag_qdrant_data:
