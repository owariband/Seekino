server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 32m;
    client_body_timeout 120s;

    # Resolve a recreated API container through Docker's DNS without rebuilding Web.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:9621;
    location ~ ^/(api(?:/|$)|healthz$|mcp$) {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /docs/recall-self-attention.png {
        return 301 /docs/guide/media/recall-self-attention.png;
    }
    location ^~ /docs/guide/ {
        types { text/markdown md; image/png png; image/svg+xml svg; image/jpeg jpg jpeg; image/webp webp; image/gif gif; }
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location ~ ^/docs(?:/|$) {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
