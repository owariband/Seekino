    <path d="M52 64C60 54 63 44 64 36V64Z" fill="#349489"/>
    <g fill="#fcfaf1">
      <circle cx="15" cy="16" r="2.4"/>
      <circle cx="26" cy="9" r="3.1"/>
      <circle cx="40" cy="11" r="2.3"/>
      <circle cx="50" cy="19" r="2.8"/>
      <circle cx="33" cy="20" r="2.4"/>
      <circle cx="21" cy="23" r="1.7"/>
      <circle cx="44" cy="25" r="1.6"/>
    </g>
  </g>
  <g fill="#0b3b33">
    <circle cx="20" cy="30.5" r="3.4"/>
    <circle cx="44" cy="30.5" r="3.4"/>
  </g>
  <path d="M15 42.5H49" stroke="#0b3b33" stroke-width="3.4" stroke-linecap="round"/>
