[project]
name = "anivag"
version = "0.1.0"
description = "Event-level multimodal video retrieval application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arkruntime>=0.6,<1",
    "claude-agent-sdk==0.2.158",
    "ddgs>=9.16,<10",
    "elasticsearch>=8.19,<9",
    "fastapi>=0.115,<1",
    "httpx[socks]>=0.28,<1",
    "langchain>=1.2,<2",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.1,<2",
    "langgraph>=1.2,<2",
    "openai>=1.66,<3",
    "openai-codex==0.156.1",
    "opentelemetry-api==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-exporter-otlp-proto-common==1.45.0",
    "pillow>=11,<13",
    "pydantic>=2.0,<3",
    "pymysql>=1.1,<2",
    "pyyaml>=6.0,<7",
    "qdrant-client>=1.19,<2",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.30,<1",
    "redis>=5,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live_agent: calls a real external Agent model provider",
]
