# Connection details live in model_sources; per-stage choices live in models.
# Legacy config files remain supported. See docs/model-config.md.
config_version: 2

# Select the primary chat harness at startup; model bindings stay independent.
supervisor_harness: codex

# Server records Token usage locally; optional tracing stays disabled.
tracing:
  enabled: false
  environment: development

model_sources:
  deepseek_api:
    adapter: openai
    provider: deepseek
    profile: deepseek
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
  ark_default:
    adapter: ark
    provider: ark
    api_key_env: ARK_API_KEY
  codex_local:
    adapter: codex_app_server
    provider: codex
    max_concurrency: 10

  campplus_local:
    adapter: campplus
    provider: local
    checkpoint_path: /Users/bytedance/workspace/other-project/AniVAG/outputs/local-models/campplus/campplus_cn_common.bin
    cpu_threads: 6
    max_audio_seconds: 30

models:
  agent:
    source: codex_local
    model: gpt-5.6-sol
    supports_vision_input: true
    max_output_tokens: 8192
    request_timeout_seconds: 600
  supervisor:
    source: codex_local
    model: gpt-5.6-sol
    supports_vision_input: true
    reasoning_effort: low
    max_output_tokens: 8192
    request_timeout_seconds: 1200
    context_window_tokens: 128000
    context_safety_margin_tokens: 2048
    auto_compact_tokens: 90000
    compact_target_tokens: 60000
    max_input_chars: 400000
  transcription:
    source: ark_default
    model: doubao-seed-2-0-lite-260428
  vision:
    source: codex_local
    model: gpt-5.6-sol
    supports_vision_input: true
    max_output_tokens: 8192
    reasoning_effort: low
    request_timeout_seconds: 600
    context_window_tokens: 128000
    context_safety_margin_tokens: 2048
    auto_compact_tokens: 90000
    compact_target_tokens: 60000
    max_input_chars: 400000
  vision_fallback:
    source: deepseek_api
    model: deepseek-flash
    reasoning_effort: none
    max_output_tokens: 8192
    request_timeout_seconds: 1200
  embedding:
    kind: embedding
    source: ark_default
    model: doubao-embedding-vision-250615
    dimensions: 1024
    video_fps: 1.0
    request_timeout_seconds: 600
  speaker:
    kind: speaker_embedding
    source: campplus_local
    model: iic/speech_campplus_sv_zh-cn_16k-common
    request_timeout_seconds: 30
  rerank:
    kind: rerank
    source: deepseek_api
    model: deepseek-flash
    reasoning_effort: none
    max_output_tokens: 8192
    request_timeout_seconds: 180

# Global Chat Agent settings. Changes to these values apply to new messages,
# except maximum_concurrent_kicks, which takes effect after restarting Server.
agent_runtime:
  history_message_limit: 12
  default_top_k: 3
  maximum_top_k: 20
  max_loop_turns: 3
  max_model_calls_per_turn: 6
  maximum_model_calls_per_turn: 12
  max_tool_calls_per_turn: 24
  maximum_tool_calls_per_turn: 48
  limits_enabled: false
  total_timeout_enabled: true
  query_reasoning_effort: low
  supervisor_reasoning_effort: none
  web_search_max_results: 5
  web_search_timeout_seconds: 12
  max_output_tokens: 8192
  max_prompt_chars: 200000
  context_window_tokens: 64000
  context_safety_margin_tokens: 4096
  auto_compact_tokens: 48000
  compact_target_tokens: 24000
  max_tool_result_bytes: 16384
  max_catalog_items_per_page: 20
  # Query has a separate stage timeout; Supervisor time includes delegated investigations.
  stage_timeout_seconds: 480
  supervisor_timeout_seconds: 1200
  execution_timeout_seconds: 1200
  maximum_concurrent_kicks: 4
  # Bound concurrent Query investigations delegated by one Supervisor tool call.
  maximum_parallel_queries: 3

video_parser:
  transcript_fps: 1.0
  video_fps: 1.0
  fallback:
    enabled: true
    frame_fps: 0.5
    group_duration_seconds: 30
    max_frames_per_group: 15
    max_height: 720
