[project]
name = "gateway"
version = "0.1.0"
description = "AniVAG model capabilities and smoke-test CLI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arkruntime>=0.6,<1",
    "httpx[socks]>=0.28,<1",
    "openai>=1.66,<3",
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
]

[project.scripts]
anivag-model = "gateway.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
