name: anivag-local

# Development dependencies only. API, Consumer, Vite and ffmpeg run on the host.
services:
  redis:
    image: redis:7.4-alpine
    profiles: [cloud-auth]
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec]
    ports:
      - "127.0.0.1:${ANIVAG_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    stop_grace_period: 30s

  mysql:
    image: mysql:8.4
    environment:
      # Matches .env.example. Loopback-only ports; not a production credential policy.
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: anivag_development
    ports:
      - "127.0.0.1:${ANIVAG_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "--protocol=TCP", "-h", "127.0.0.1", "-uroot", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    stop_grace_period: 60s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.22
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"  # Loopback-only local development instance.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${ANIVAG_ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - 'exec 3<>/dev/tcp/127.0.0.1/9200; printf "GET /_cluster/health?wait_for_status=yellow&timeout=1s HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; read -r status <&3; [[ "$$status" == *" 200 "* ]]'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    stop_grace_period: 60s

volumes:
  redis_data:
  mysql_data:
  elasticsearch_data:
